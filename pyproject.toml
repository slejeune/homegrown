[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmgr"
version = "0.1.0"
description = "A local AI-assisted GitHub workflow CLI using Git, GitHub CLI and Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hmgr = "hmgr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hmgr = ["templates/*.md"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
